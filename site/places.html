    td.ro { font-weight:600; }

const fmt = (n) => Number(n).toLocaleString(SiteLang.locale(lang));
const fold = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const VARIANT_RULES = [["x", "cs"], ["cs", "ci"], ["sz", "s"], ["zs", "j"], ["gy", "g"], ["ny", "n"], ["ly", "l"],

function variantKey(word) { for (const [a, b] of VARIANT_RULES) word = word.split(a).join(b); return word.replace(/(.)\1+/g, "$1"); }

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (SiteLang.CODES.includes(p.get("lang"))) lang = p.get("lang");
  $("q").value = p.get("q") || ""; $("county").dataset.want = p.get("county") || "";
}
function writeHash() {
  const p = new URLSearchParams({ lang });
  if ($("q").value) p.set("q", $("q").value);
  if ($("county").value) p.set("county", $("county").value);
  history.replaceState(null, "", `#${p}`);

SiteLang.mount($("lang-menu"), (code) => { lang = code; applyLang(); run(); });
function applyLang() {
  lang = SiteLang.apply(lang);
  document.title = `${t("title")} · Stare Civilă IDX Finder`;
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);

  for (const name of catalogueCounties) select.append(new Option(countyLabel(name), name));

}

function run() {
  writeHash();
  const query = words($("q").value).map(variantKey), county = $("county").value;

  const full = words($("q").value).join(" ");

  }
}

  const query = words($("q").value).map(variantKey);
  const body = $("rows");
  if (!matches.length) { const c = body.insertRow().insertCell(); c.colSpan = 6; c.className = "empty"; c.textContent = t("none"); }
  for (const p of matches.slice(shown, shown + PAGE)) {
    const r = body.insertRow();
    const ro = r.insertCell(); ro.className = "ro"; nameCell(ro, [p.ro, ...(p.other.ro || [])], query);
    const c = r.insertCell(); c.textContent = countyLabel(p.county); c.dataset.label = t("thCounty");
    const hu = r.insertCell(); hu.dataset.label = "Magyar"; nameCell(hu, p.other.hu || [], query);
    const de = r.insertCell(); de.dataset.label = "Deutsch"; nameCell(de, p.other.de || [], query);
    const other = r.insertCell(); other.className = "other"; other.dataset.label = t("thOther");
    for (const [l, list] of Object.entries(p.other)) {
      if (["ro", "hu", "de"].includes(l)) continue;
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = l; other.append(tag);
      nameCell(other, list, query);
    }
    const tools = r.insertCell(); tools.className = "tools";
    const ci = catalogueCounties.indexOf(p.county);
    const search = document.createElement("a");
    search.href = `index.html#${new URLSearchParams({ tab: "names", lang, "n-place": p.ro, ...(ci >= 0 ? { "n-county": ci } : {}) })}`;
    search.textContent = t("search");
    const wd = document.createElement("a"); wd.href = `https://www.wikidata.org/wiki/${p.qid}`; wd.target = "_blank"; wd.rel = "noopener"; wd.textContent = t("wikidata");
    tools.append(search, wd);
  }
  shown = Math.min(shown + PAGE, matches.length);
  $("more").hidden = shown >= matches.length;
  $("more").textContent = t("more", { n: fmt(matches.length - shown) });
}
$("more").onclick = more;
let timer;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 200); });
$("county").addEventListener("change", run);
window.addEventListener("hashchange", () => { readHash(); applyLang(); run(); });

(async () => {
  lang = SiteLang.pick();
  readHash(); applyLang();
  $("count").textContent = t("loading");
  try {
    const [placesJson, catalogue] = await Promise.all([fetch("data/places.json"), fetch("data/catalogue.json")].map(async r => {
      const response = await r; if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json();
    }));
    catalogueCounties = catalogue.counties.map(c => c.name);
    places = placesJson.places.map(([qid, ro, county, other]) => {
      const all = [ro, ...Object.values(other).flat()];
      return { qid, ro, county, other, names: new Set(all.map(n => words(n).join(" "))), keys: [...new Set(all.flatMap(n => words(n).map(variantKey)))] };
    });
  } catch (error) { $("count").textContent = /HTTP 404/.test(error.message) ? t("notBuilt") : t("error", { e: error.message }); return; }
  applyLang();
  run();
})();
</script>
<!-- Cookieless visit counter: sends the page path (never the #… search state), title, referrer, screen size. -->
<script data-goatcounter="https://costinfl.goatcounter.com/count" async src="count.js"></script>
</body>
