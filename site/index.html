<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <script src="theme.js"></script>
  <title>Stare Civilă IDX Finder</title>
  <meta name="description" content="Căutare în indexurile de nume (IDX) ale registrelor de stare civilă din Arhivele Naționale ale României.">
  <style>
    :root { color-scheme: light; --ink:#182431; --muted:#5d6d7c; --line:#dce3e8; --blue:#165d87; --blue-dark:#104665; --paper:#fff; --wash:#f3f6f8; --mark:#fff1b8; --focus:#165d8733; --tab:#e8eef2; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --ink:#e3e9ee; --muted:#9aabb9; --line:#2c3a46; --blue:#7cc0ea; --blue-dark:#a5d4f2; --paper:#17212a; --wash:#0f171e; --mark:#5b4a12; --focus:#7cc0ea40; --tab:#22303b; } }
    :root[data-theme="dark"] { color-scheme: dark; --ink:#e3e9ee; --muted:#9aabb9; --line:#2c3a46; --blue:#7cc0ea; --blue-dark:#a5d4f2; --paper:#17212a; --wash:#0f171e; --mark:#5b4a12; --focus:#7cc0ea40; --tab:#22303b; }
    .theme-toggle { display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:7px; background:var(--tab); color:var(--ink); padding:4px 7px; min-height:26px; cursor:pointer; }
    .theme-toggle:hover { background:var(--line); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--wash); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:1180px; margin:0 auto; padding:28px 22px 56px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    h1 { margin:0 0 6px; font-size:clamp(25px,4vw,34px); line-height:1.15; letter-spacing:-.03em; }
    header p { margin:4px 0 0; color:var(--muted); max-width:820px; }
    .lang { display:flex; gap:4px; flex-shrink:0; align-items:center; font-size:13px; }
    .lang button { background:var(--tab); color:var(--ink); padding:5px 9px; font-size:12px; }
    .lang button[aria-pressed="true"] { background:var(--blue); color:var(--paper); }
    .lang a { margin-right:8px; }
    .tabs { display:flex; gap:6px; margin-top:18px; }
    .tabs button { background:var(--tab); color:var(--ink); border-radius:8px 8px 0 0; padding:9px 16px; font-size:14px; }
    .tabs button[aria-selected="true"] { background:var(--paper); color:var(--blue); box-shadow:inset 0 -2px 0 var(--blue); }
    .tabs button:hover { background:var(--paper); }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px; margin:0 0 18px; }
    .tabs + div > .panel:first-child, .tabs + .panel { border-top-left-radius:0; }
    .filters { display:grid; grid-template-columns:2fr 1fr .6fr .6fr; gap:12px; align-items:end; }
    .filters.names { grid-template-columns:1.6fr 1.2fr 1fr .9fr .6fr .6fr; }
    label { display:block; font-weight:650; font-size:13px; margin:0 0 5px; }
    label.check { display:inline-flex; gap:6px; align-items:center; font-weight:500; margin:0; }
    label.check input { width:auto; }
    input, select { width:100%; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:7px; padding:9px 10px; font:inherit; }
    input:focus, select:focus { outline:3px solid var(--focus); border-color:var(--blue); }
    .meta { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; align-items:center; margin-top:12px; color:var(--muted); font-size:13px; }
    .meta .actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .hint { color:var(--muted); font-size:12.5px; margin-top:8px; }
    button { border:0; border-radius:7px; padding:8px 13px; background:var(--blue); color:var(--paper); font:inherit; font-size:13px; font-weight:650; cursor:pointer; }
    button:hover { background:var(--blue-dark); }
    button:disabled { opacity:.5; cursor:default; }
    button.link { background:none; color:var(--blue); padding:0; font-weight:500; font-size:12px; text-decoration:underline; }
    .table-wrap { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; font-size:13.5px; }
    th, td { text-align:left; vertical-align:top; padding:9px 8px; border-bottom:1px solid var(--line); }
    th { font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    td.call { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; white-space:nowrap; }
    td.nowrap { white-space:nowrap; }
    td.name { font-weight:600; }
    td.tools { white-space:nowrap; }
    td.tools > * + * { margin-left:10px; }
    .sub { color:var(--muted); font-size:12px; word-break:break-all; }
    a { color:var(--blue); }
    mark { background:var(--mark); color:inherit; border-radius:2px; }
    .empty { color:var(--muted); padding:18px 4px; }
    .more { text-align:center; margin-top:14px; }
    .banner { display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--tab); border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:13px; }
    footer { color:var(--muted); font-size:12.5px; margin-top:24px; }
    details.progress { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; font-size:13px; }
    details.progress summary { cursor:pointer; color:var(--muted); }
    details.progress summary strong { color:var(--ink); }
    .bar { height:8px; background:var(--tab); border-radius:4px; overflow:hidden; margin:6px 0 2px; }
    .bar > span { display:block; height:100%; background:var(--blue); }
    .bar.small { height:6px; min-width:80px; margin:6px 0 0; }
    table.counties { margin-top:10px; font-size:12.5px; }
    table.counties td, table.counties th { padding:5px 8px; }
    table.counties td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
    .toast.show { opacity:1; }
    [hidden] { display:none !important; }
    @media (max-width:860px) { .filters.names { grid-template-columns:1fr 1fr 1fr; } }
    @media (max-width:760px) {
      main { padding:18px 16px 40px; }
      .top { flex-direction:column-reverse; }
      .filters, .filters.names { grid-template-columns:1fr 1fr; }
      .filters .wide { grid-column:1 / -1; }
      thead { display:none; }
      table, tbody, tr, td { display:block; width:100%; }
      tr { border-bottom:1px solid var(--line); padding:8px 0; }
      td { border:0; padding:2px 0; }
      td.call { white-space:normal; word-break:break-all; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="top">
      <div>
        <h1>Stare Civilă IDX Finder</h1>
        <p data-i18n-html="intro"></p>
      </div>
      <div class="lang"><a href="places.html" id="places-link" data-i18n="historical"></a><a href="about.html" id="about-link" data-i18n="about"></a><button class="theme-toggle" type="button"></button><button id="lang-ro" aria-pressed="true">RO</button><button id="lang-hu" aria-pressed="false">HU</button><button id="lang-en" aria-pressed="false">EN</button></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-names" aria-controls="view-names" aria-selected="true" data-i18n="tabNames"></button>
    <button role="tab" id="tab-registers" aria-controls="view-registers" aria-selected="false" data-i18n="tabRegisters"></button>
  </nav>

  <div id="view-names" role="tabpanel" aria-labelledby="tab-names">
    <section class="panel">
      <div class="filters names">
        <div class="wide"><label for="n-q" data-i18n="lblName"></label><input id="n-q" type="search" data-i18n-ph="phName" autocomplete="off"></div>
        <div class="wide"><label for="n-place" data-i18n="lblPlace"></label><input id="n-place" type="search" data-i18n-ph="phPlace" autocomplete="off"></div>
        <div class="wide"><label for="n-county" data-i18n="lblCounty"></label><select id="n-county"><option value="" data-i18n="allCounties"></option></select></div>
        <div><label for="n-event" data-i18n="lblEvent"></label><select id="n-event"><option value="" data-i18n="evAll"></option><option value="b" data-i18n="evB"></option><option value="m" data-i18n="evM"></option><option value="d" data-i18n="evD"></option></select></div>
        <div><label for="n-from" data-i18n="lblFrom"></label><input id="n-from" type="number" inputmode="numeric" min="1500" max="2100" placeholder="1850"></div>
        <div><label for="n-to" data-i18n="lblTo"></label><input id="n-to" type="number" inputmode="numeric" min="1500" max="2100" placeholder="1920"></div>
      </div>
      <div class="meta">
        <span id="n-count" role="status" aria-live="polite"></span>
        <span class="actions"><label class="check"><input id="n-hist" type="checkbox" checked> <span data-i18n="hist"></span></label><label class="check"><input id="n-exact" type="checkbox"> <span data-i18n="exact"></span></label><button id="n-csv" disabled data-i18n="csv"></button></span>
      </div>
      <div class="hint" id="n-gen-link" hidden></div>
      <div class="hint" data-i18n="hintNames"></div>
      <details class="progress" id="progress" hidden>
        <summary id="progress-summary"></summary>
        <div class="bar" aria-hidden="true"><span id="progress-bar"></span></div>
        <div class="table-wrap">
          <table class="counties">
            <thead><tr><th data-i18n="thCounty"></th><th data-i18n="thIndexed"></th><th></th><th data-i18n="thNames"></th><th data-i18n="thLastRun"></th></tr></thead>
            <tbody id="progress-rows"></tbody>
          </table>
        </div>
      </details>
    </section>
    <section class="panel">
      <div class="banner" id="n-banner" hidden><span id="n-banner-text"></span><button class="link" id="n-back" data-i18n="back"></button></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th data-i18n="thName"></th><th data-i18n="thEvent"></th><th data-i18n="thDate"></th><th data-i18n="thPlace"></th><th data-i18n="thAct"></th><th data-i18n="thRegister"></th><th></th></tr></thead>
          <tbody id="n-rows"></tbody>
        </table>
      </div>
      <div class="more"><button id="n-more" hidden></button> <button id="n-more-regs" hidden></button></div>
    </section>
  </div>

  <div id="view-registers" role="tabpanel" aria-labelledby="tab-registers" hidden>
    <section class="panel">
      <div class="filters">
        <div class="wide"><label for="q" data-i18n="lblQ"></label><input id="q" type="search" data-i18n-ph="phQ" autocomplete="off"></div>
        <div class="wide"><label for="county" data-i18n="lblCounty"></label><select id="county"><option value="" data-i18n="allCounties"></option></select></div>
        <div><label for="from" data-i18n="lblFrom"></label><input id="from" type="number" inputmode="numeric" min="1500" max="2100" placeholder="1800"></div>
        <div><label for="to" data-i18n="lblTo"></label><input id="to" type="number" inputmode="numeric" min="1500" max="2100" placeholder="1950"></div>
      </div>
      <div class="meta"><span id="count" role="status" aria-live="polite"></span><button id="csv" disabled data-i18n="csv"></button></div>
      <div class="hint" id="gen-link" hidden></div>
    </section>
    <section class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th data-i18n="thCounty"></th><th data-i18n="thCall"></th><th data-i18n="thTitle"></th><th data-i18n="thYears"></th><th data-i18n="thLevel"></th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="more"><button id="more" hidden></button></div>
    </section>
  </div>

  <footer><span id="footer"></span> <span data-i18n-html="attribution"></span></footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

}
function passesFilters(row, f) {
  const reg = byId.get(row[0]);
  if (f.county !== null && (!reg || reg.c !== f.county)) return false;
  if (f.event && row[10] !== f.event) return false;
  const [y0, y1] = rowYear(row);

async function placeRegisters(keys, f) {
  // Registers whose place index has every place word (by variant-key prefix).

  for (const k of keys) {
    const prefix = k.slice(0, names.min_token);
    const found = new Set();
    for (const p of Object.keys(names.places).filter(p => p.startsWith(prefix) || prefix.startsWith(p))) {
      const table = await fetchGz(`p/${p}.gz`);
      for (const [placeKey, refs] of Object.entries(table)) if (placeKey.startsWith(k)) for (const [rid] of refs) found.add(rid);
    }
    result = result === null ? found : new Set([...result].filter(r => found.has(r)));
  }
  return [...(result || [])].filter(rid => {
    const reg = byId.get(rid);
    if (!reg) return true;
    if (f.county !== null && reg.c !== f.county) return false;
    if (f.from && reg.y1 && reg.y1 < f.from) return false;
    if (f.to && reg.y0 && reg.y0 > f.to) return false;

}
async function runNames() {
  if (tab === "names") writeHash();
  renderGenLinks();
  if (!data) return;
  if (!names) { idleStatus(); return; }
  const run = ++nameRun;
  const exact = $("n-exact").checked;
  const nameWords = [...new Set(words($("n-q").value))], placeWords = [...new Set(words($("n-place").value))];
  const nameKeys = nameWords.map(variantKey), placeKeys = placeWords.map(variantKey);
  const f = filters();
  $("n-rows").replaceChildren(); $("n-more").hidden = true; $("n-csv").disabled = true; $("n-banner").hidden = true; nameMatches = [];
  placeBatch = null; $("n-more-regs").hidden = true;
  const alternatives = placeWords.length ? await placeAlternatives($("n-place").value, f) : [];
  if (run !== nameRun) return;
  // Each alternative: [variant keys, exact words]; the first is the query itself.
  const placeAlts = [[placeKeys, exact ? placeWords : null], ...alternatives.map(n => [words(n).map(variantKey), exact ? words(n) : null])];
  currentPlaceKeys = [...new Set(placeAlts.flatMap(a => a[0]))];
  const also = alternatives.length ? t("alsoSearched", { names: alternatives.join(", ") }) : "";

  let rows;
  try {
    if (browseId) {
      const reg = byId.get(browseId);
      rows = names.registers[browseId] ? await fetchGz(`r/${browseId}.gz`) : [];
      if (run !== nameRun) return;
      $("n-banner").hidden = false;
      $("n-banner-text").textContent = t("registerView", { n: fmt(rows.length), call: reg ? reg.call : browseId });
      nameMatches = rows.slice();
      currentPlaceKeys = [];
      return finishNames(nameMatches.length ? null : "noNames");
    }
    const usableNames = nameKeys.filter(k => k.length >= names.min_token);
    const usablePlaces = placeKeys.filter(k => k.length >= names.min_token);
    if (!usableNames.length && !usablePlaces.length) {
      if (nameWords.length || placeWords.length) return setStatus("minLetters", { n: names.min_token });
      return (f.county !== null || f.event || f.from || f.to) ? setStatus("needNameOrPlace") : idleStatus();
    }
    if (usableNames.length) {
      let best = null;
      for (const k of usableNames) {
        const keys = shardsFor(k), bytes = keys.reduce((s, x) => s + names.shards[x][1], 0);
        if (!best || bytes < best.bytes) best = { k, keys, bytes };
      }
      if (!best.keys.length) return finishNames("noNames");
      if (best.bytes > MAX_DOWNLOAD) return setStatus("tooCommon", { w: best.k, mb: (best.bytes / 1e6).toFixed(0) });
      setStatus("searching", { mb: (best.bytes / 1e6).toFixed(1) });
      rows = (await Promise.all(best.keys.map(k => fetchGz(`n/${k}.gz`)))).flat();
    } else {
      const found = new Set();
      for (const [keys] of placeAlts) {
        const usable = keys.filter(k => k.length >= names.min_token);
        if (usable.length) for (const rid of await placeRegisters(usable, f)) found.add(rid);
      }
      if (run !== nameRun) return;
      // Oldest registers first; load them MAX_REGISTERS at a time ("Load the next … registers").
      const year = (rid) => byId.get(rid)?.y0 ?? 9999;
      const rids = [...found].sort((a, b) => year(a) - year(b) || a - b);
      const first = rids.slice(0, MAX_REGISTERS);
      placeBatch = { run, pending: rids.slice(MAX_REGISTERS), total: rids.length, loaded: first.length };
      setStatus("searching", { mb: (first.length * 0.03).toFixed(1) });
      rows = (await Promise.all(first.map(r => fetchGz(`r/${r}.gz`)))).flat();
    }
  } catch (error) { if (run === nameRun) setStatus("loadError", { e: error.message }); return; }
  if (run !== nameRun) return;

  const nameExact = exact ? nameWords : null;
  const seen = new Set();
  const accept = (row) => {
    const key = `${row[0]}|${row[1]}|${row[4]}|${row[6]}|${row[8]}`;
    if (seen.has(key)) return false;
    if (nameKeys.length && !matchesWords(row[1], nameKeys, nameExact)) return false;
    if (placeKeys.length && !placeAlts.some(([keys, exactWords]) => keys.length && matchesWords(row[2], keys, exactWords))) return false;
    if (!passesFilters(row, f)) return false;

    return true;
  };
  nameMatches = rows.filter(accept);
  sortMatches();
  if (placeBatch) Object.assign(placeBatch, { accept, also });
  finishNames(nameMatches.length || placeBatch?.pending.length ? null : "noNames", also);
}
function sortMatches() {
  const sortKey = (row) => row[9] || String(byId.get(row[0])?.y0 || "9999");  // undated: register's first year, else last
  nameMatches.sort((a, b) => sortKey(a).localeCompare(sortKey(b)) || a[1].localeCompare(b[1], "ro"));
}
async function loadMoreRegisters() {
  const batch = placeBatch;
  if (!batch || batch.run !== nameRun || !batch.pending.length) return;
  const next = batch.pending.splice(0, MAX_REGISTERS);
  const button = $("n-more-regs"); button.disabled = true;
  let rows;
  try { rows = (await Promise.all(next.map(r => fetchGz(`r/${r}.gz`)))).flat(); }
  catch (error) { button.disabled = false; batch.pending.unshift(...next); setStatus("loadError", { e: error.message }); return; }
  if (batch !== placeBatch || batch.run !== nameRun) return;  // a newer search started meanwhile
  batch.loaded += next.length;
  nameMatches.push(...rows.filter(batch.accept));
  sortMatches();
  const keep = Math.max(nameShown, PAGE);  // keep as many rows on screen as before
  nameShown = 0; $("n-rows").replaceChildren();
  while (nameShown < Math.min(keep, nameMatches.length)) moreNames(null);
  if (!nameMatches.length) moreNames("noNames");
  updateStatus(batch.also);
  button.disabled = false;
}
$("n-more-regs").onclick = loadMoreRegisters;
function updateStatus(suffix = "") {
  setStatus("results", { n: fmt(nameMatches.length), records: fmt(names.records), total: fmt(data.items.length) });
  if (placeBatch && placeBatch.run === nameRun && placeBatch.pending.length)
    $("n-count").textContent += t("partialRegisters", { loaded: fmt(placeBatch.loaded), total: fmt(placeBatch.total) });
  if (suffix) $("n-count").textContent += suffix;
  $("n-csv").disabled = !nameMatches.length;
  const left = placeBatch && placeBatch.run === nameRun ? placeBatch.pending.length : 0;
  $("n-more-regs").hidden = !left;
  if (left) $("n-more-regs").textContent = t("moreRegisters", { n: fmt(Math.min(MAX_REGISTERS, left)), left: fmt(left) });
}
function finishNames(emptyKey, suffix = "") {
  nameShown = 0; $("n-rows").replaceChildren(); moreNames(emptyKey);
  updateStatus(suffix);
}
function shownDate(row) { const date = row[4], year = row[5]; return date && !date.startsWith("#") ? date : (year || date); }
function eventLabel(row) { return row[3] || (EVENTS[row[10]] ? t(EVENTS[row[10]]) : ""); }
function citeEntry(row) {
  const reg = byId.get(row[0]);
  return t("citeEntry", {
    name: row[1], event: eventLabel(row) ? `, ${eventLabel(row)}` : "", date: shownDate(row) ? ` ${shownDate(row)}` : "",
    county: reg ? countyName(reg.c) : "", title: reg ? reg.title || t("untitled") : "", call: reg ? reg.call : row[0],
    act: row[6] ? `, ${t("act")} ${row[6]}` : "", page: row[7] ? `, ${t("page")} ${row[7]}` : "", image: row[8] ? `, ${t("image")} ${row[8]}` : "",
    url: recordUrl(row[0]), today: today(),
  });
}
function reportUrl(row) {
  const reg = byId.get(row[0]);
  const entry = [row[1], row[2], row[3], shownDate(row), row[6] && `act ${row[6]}`, row[7] && `p. ${row[7]}`, row[8]].filter(Boolean).join(" · ");
  const p = new URLSearchParams({ template: "report-entry.yml", title: `[Entry] ${row[1]} — ${reg ? reg.call : row[0]}`, record_url: recordUrl(row[0]), entry });
  return `${REPO}/issues/new?${p}`;
}
function moreNames(emptyKey) {
  const nameKeys = queryKeys($("n-q").value), placeKeys = currentPlaceKeys;
  const body = $("n-rows");
  if (emptyKey && !nameMatches.length) { const c = body.insertRow().insertCell(); c.colSpan = 7; c.className = "empty"; c.textContent = t(emptyKey); }
  for (const row of nameMatches.slice(nameShown, nameShown + PAGE)) {
    const [id, name, place, , , , act, page, image] = row;
    const reg = byId.get(id);
    const r = body.insertRow();
    const n = r.insertCell(); n.className = "name"; highlight(n, name, browseId ? [] : nameKeys, true);
    r.insertCell().textContent = eventLabel(row);
    const d = r.insertCell(); d.className = "nowrap"; d.textContent = shownDate(row);
    const pl = r.insertCell(); highlight(pl, place, browseId ? [] : placeKeys, true);
    const ap = r.insertCell();
    ap.textContent = [act && `${t("act")} ${act}`, page && `${t("page")} ${page}`].filter(Boolean).join(" · ");
    if (image) { const s = document.createElement("div"); s.className = "sub"; s.textContent = image; ap.append(s); }
    const rc = r.insertCell();
    rc.append(link(recordUrl(id), reg ? reg.call : `#${id}`));
    if (reg) { const s = document.createElement("div"); s.className = "sub"; s.textContent = `${countyName(reg.c)} · ${reg.years}`; rc.append(s); }
    const tools = r.insertCell(); tools.className = "tools";
    tools.append(button(t("cite"), () => copy(citeEntry(row))));

function openRegister(id) { browseId = id; showTab("names"); runNames(); window.scrollTo({ top: $("view-names").offsetTop, behavior: "smooth" }); }
$("n-back").onclick = () => { browseId = null; runNames(); };
$("n-more").onclick = () => moreNames(null);
$("n-csv").onclick = () => csv("stare-civila-names.csv", [["name", "place", "event", "date", "year", "act", "page", "image", "county", "call_number", "register_title", "record_url"],
  ...nameMatches.map(row => { const reg = byId.get(row[0]); return [row[1], row[2], row[3], row[4], row[5], row[6], row[7], row[8], reg ? data.counties[reg.c].name : "", reg ? reg.call : "", reg ? reg.title : "", recordUrl(row[0])]; })]);

/* ---------- wiring ---------- */
function debounce(fn) { let timer; return () => { clearTimeout(timer); timer = setTimeout(fn, 250); }; }
const nameInput = debounce(() => { browseId = null; runNames(); }), regInput = debounce(runRegisters);

(async () => {
  const stored = store.get("lang");
  const browser = (navigator.language || "").toLowerCase();
  lang = LANGS.includes(stored) ? stored : browser.startsWith("hu") ? "hu" : browser.startsWith("ro") ? "ro" : "en";
