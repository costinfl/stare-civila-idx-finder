name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "names_export.py", "privacy/**", ".github/workflows/pages.yml"]
  # Commits pushed by the refresh workflow's token don't fire push events.
  workflow_run:
    workflows: ["Refresh catalogue", "Crawl IDX names", "Build place names"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: names-data
          path: names-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build name-index shards
        run: python names_export.py --store names-data/names --out site/data/names
      - uses: actions/configure-pages@v5
      # One artifact name per attempt: a re-run would otherwise find the failed
      # attempt's "github-pages" artifact too and refuse to deploy.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      # Large uploads can take a moment to become visible to deploy-pages.
      - name: Let the upload register
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
