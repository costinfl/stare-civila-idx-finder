name: Build place names

# Rebuilds site/data/places.json — Hungarian, German and other historical
# names of Romanian settlements — from Wikidata (CC0) via a public SPARQL
# endpoint (two queries). Monthly and on demand; commits only when changed,
# and the Pages deploy follows via workflow_run.
on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: places
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python places_build.py
      - name: Commit place names if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add site/data/places.json
          git diff --cached --quiet || git commit -m "Refresh historical place names (Wikidata)"
          git push
