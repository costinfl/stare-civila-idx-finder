name: Refresh catalogue

# Manual only: re-runs the polite listing crawl (~500 requests, one every
# 1.25 s) and commits the updated site/data/catalogue.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python crawl.py --refresh
      - name: Commit catalogue if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add site/data/catalogue.json
          git diff --cached --quiet || git commit -m "Refresh IDX catalogue"
          git push
